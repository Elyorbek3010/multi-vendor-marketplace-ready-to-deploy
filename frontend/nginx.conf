# 1. Define upstream services (internal Docker hostnames & ports)
upstream django_backend {
    server backend:8000;
}



server {
    listen 80;
    server_name localhost; # Replace with your real domain in production
    client_max_body_size 20M;

    # 2. React UI (Single Page App routing)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 3. Django Admin and REST API
    location ~ ^/(api|admin)/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Django Admin & App Static Files
    location /static/ {
        alias /var/www/static/;
    }

    # 5. FastAPI WebSockets
    location /ws/ {
        proxy_pass http://realtime:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}