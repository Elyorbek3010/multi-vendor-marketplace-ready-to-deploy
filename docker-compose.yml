version: '3.8'

services:
  db:
    image: postgres:15
    container_name: marketplace_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketplace_db}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: marketplace_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: marketplace_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env

  celery_worker:
    build: ./backend
    container_name: marketplace_celery
    command: celery -A core worker -l info
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
      - backend
    env_file:
      - .env

  realtime:
    build: ./real_time_service
    container_name: marketplace_realtime
    ports:
      - "8001:8001"
    volumes:
      - ./real_time_service:/app
    depends_on:
      - redis
    env_file:
      - .env

  frontend:
    build: ./frontend
    container_name: marketplace_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env

volumes:
  postgres_data:
  media_data:
