
services:
  db:
    image: postgres:15-alpine
    container_name: marketplace_prod_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - marketplace_network

  redis:
    image: redis:7-alpine
    container_name: marketplace_prod_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    networks:
      - marketplace_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: marketplace_prod_backend
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2
    env_file:
      - .env.prod
    volumes:
      - django_static:/app/staticfiles
    depends_on:
      - db
      - redis
    networks:
      - marketplace_network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: marketplace_prod_celery
    restart: always
    command: celery -A config worker -l info --concurrency=2
    env_file:
      - .env.prod
    depends_on:
      - db
      - redis
      - backend
    networks:
      - marketplace_network

  realtime:
    build:
      context: ./real_time_service
      dockerfile: Dockerfile
    container_name: marketplace_prod_realtime
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --workers 2
    env_file:
      - .env.prod
    depends_on:
      - redis
    networks:
      - marketplace_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: marketplace_prod_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - django_static:/var/www/static
    depends_on:
      - backend
      - realtime
    networks:
      - marketplace_network

networks:
  marketplace_network:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  django_static: