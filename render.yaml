databases:
  - name: marketplace-db
    databaseName: marketplace
    user: marketplace_user
    plan: free


services:
  - type: redis
    name: marketplace-redis
    plan: free
    ipAllowList: []

  - type: web
    name: marketplace-backend
    env: python
    plan: free
    buildCommand: "./backend/build.sh"
    startCommand: "./backend/start.sh"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DATABASE_URL
        fromDatabase:
          name: marketplace-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: marketplace-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: marketplace-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: marketplace-redis
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

  - type: web
    name: marketplace-realtime
    env: python
    plan: free
    buildCommand: "pip install -r real_time_service/requirements.txt"
    startCommand: "uvicorn main:app --app-dir real_time_service --host 0.0.0.0 --port $PORT --workers 1"
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: marketplace-redis
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0


