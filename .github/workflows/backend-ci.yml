name: Backend CI

on:
  push:
    branches: [ "main", "deploy/render-vercel" ]
  pull_request:
    branches: [ "main", "deploy/render-vercel" ]

jobs:
  test:
    name: Run Django Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: marketplace_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      working-directory: ./backend
      env:
        SECRET_KEY: 'test-secret-key'
        DEBUG: 'True'
        DATABASE_URL: postgres://user:password@localhost:5432/marketplace_db
        REDIS_URL: redis://localhost:6379/1
      run: |
        python manage.py test
